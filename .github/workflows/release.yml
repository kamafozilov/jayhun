name: Build packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: macos
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux
          - os: windows-latest
            bundles: nsis
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Jayhun.app target/release/bundle/Jayhun-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jayhun-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/*.zip
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
